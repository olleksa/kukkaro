<title>Kukkaro</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a single working column — sticky tab bar, summary tiles, then the active view. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f5; --line:#dde2ea; --line-strong:#c5ccd8;
  --ink:#16202c; --ink-2:#4a5566; --ink-3:#7a8597;
  --accent:#1d4e6e; --accent-ink:#ffffff; --accent-soft:#dfeaf2;
  --good:#1b7f4b; --warn:#a96a00; --bad:#c23a3a;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s-other:#9aa3b0;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#18202a; --surface-2:#1f2935; --line:#2a3644; --line-strong:#3a4858;
  --ink:#e8edf3; --ink-2:#b2bccb; --ink-3:#8390a2;
  --accent:#7fb4d8; --accent-ink:#0d1620; --accent-soft:#1f3446;
  --good:#4cc485; --warn:#e0a53a; --bad:#ef7a7a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s-other:#6b7686;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#18202a; --surface-2:#1f2935; --line:#2a3644; --line-strong:#3a4858;
  --ink:#e8edf3; --ink-2:#b2bccb; --ink-3:#8390a2;
  --accent:#7fb4d8; --accent-ink:#0d1620; --accent-soft:#1f3446;
  --good:#4cc485; --warn:#e0a53a; --bad:#ef7a7a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s-other:#6b7686;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand span{color:var(--ink-3);font-size:12px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;padding-bottom:6px}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink)}
nav.tabs button:hover{color:var(--ink)}
.period{display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=search]{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;min-width:0}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{padding-block:20px 60px;display:grid;gap:20px}
h2{font-size:18px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:14px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
.muted{color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.tile .k{font-size:12px;color:var(--ink-3);font-weight:600}
.tile .v{font:600 22px var(--mono);letter-spacing:-.02em}
.tile .s{font-size:12px;color:var(--ink-3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:13px}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:600}
.crumbs button{border:0;background:none;padding:2px 0;cursor:pointer;color:var(--accent)}
.crumbs .sep{color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
.rankpanel{max-height:560px;overflow:auto}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.chartbox{overflow-x:auto}
svg text{font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}
.legend button{border:0;background:none;display:flex;gap:6px;align-items:center;cursor:pointer;padding:2px 0;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.rank{display:grid;gap:4px}
.rank button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;border:0;background:none;padding:6px 6px;border-radius:8px;text-align:left;cursor:pointer}
.rank button:hover{background:var(--surface-2)}
.rank .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.rank .bar i{display:block;height:100%;border-radius:3px}
.rank .nm{display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rank .nm i{width:10px;height:10px;border-radius:3px;flex:none}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.amt,th.amt{text-align:right;white-space:nowrap}
.neg{color:var(--ink)} .pos{color:var(--good)}
.who{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--ink-3);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td input[type=text]{width:100%;min-width:150px}
td select{max-width:190px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.reg{background:var(--accent-soft);color:var(--ink)}
.pill.auto{border:1px dashed var(--line-strong);background:none}
.pill.warn{background:none;border:1px solid var(--warn);color:var(--warn)}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line-strong);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;font-weight:600}
.chip button{border:0;background:var(--surface-2);border-radius:999px;width:20px;height:20px;cursor:pointer;line-height:1}
.applybar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px}
.notice{border-left:3px solid var(--warn);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0;font-size:13px}
.drop{border:2px dashed var(--line-strong);border-radius:var(--r);padding:28px;text-align:center;display:grid;gap:8px;justify-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.gcard header{display:flex;gap:8px;align-items:center}
.gcard header input{font-weight:700;flex:1}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:8px;border-radius:8px;background:var(--surface-2)}
.catrow .ctl{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.catrow .ctl select{font-size:12px;padding:3px 6px}
.ok{color:var(--good);font-weight:700} .bad{color:var(--bad);font-weight:700}
.empty{padding:40px 16px;text-align:center;display:grid;gap:10px;justify-items:center}
details summary{cursor:pointer;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.savestate{font-size:12px;color:var(--ink-3)}
.cov td,.cov th{text-align:center;padding:4px 6px;font-size:12px}
.cov td:first-child,.cov th:first-child{text-align:left;white-space:nowrap}
.cov .c{display:inline-block;min-width:34px;padding:2px 4px;border-radius:6px;font-weight:700}
.cov .full{background:var(--accent-soft);color:var(--ink)}
.cov .part{border:1px dashed var(--accent);color:var(--ink-2)}
.cov .none{color:var(--bad);opacity:.8}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;align-items:end}
.formgrid label{display:grid;gap:2px;font-size:12px;color:var(--ink-3);font-weight:600}
.formgrid input,.formgrid select{width:100%}
input[type=date],input[type=number]{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;min-width:0}
.impcard{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;background:var(--surface)}
.del{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.del:hover{color:var(--bad)}
@media (max-width:600px){nav.tabs button{padding:6px 9px;font-size:13px}.topbar{gap:8px}header.top{position:static}}
.formgrid label.chk{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:13px}
.formgrid label.chk input{width:auto}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<header class="top">
  <div class="wrap topbar">
    <div class="brand"><b>Kukkaro</b><span id="acct">household money</span></div>
    <div class="period">
      <label class="muted" for="period">Period</label>
      <select id="period">
        <option value="all">All months</option>
        <option value="12">Last 12 months</option>
        <option value="6">Last 6 months</option>
        <option value="3">Last 3 months</option>
      </select>
      <select id="person" aria-label="Whose money" hidden></select>
    </div>
    <span class="savestate" id="savestate"></span>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div>
</header>
<div class="wrap"><main id="main"><div class="empty" id="boot"><b>Loading your transactions…</b><span class="muted" style="max-width:44ch">If this message stays, the file was opened in a preview that doesn't run apps. Open it in Safari or Chrome instead (Share › Open in Safari / Open with Chrome).</span></div></main></div>
<script>window.addEventListener("error", function(e) {
  var b = document.getElementById("boot");
  if (b) {
    b.innerHTML = '<b>Kukkaro could not start</b><span class="muted">' + String(e.message || e).replace(/</g, "&lt;") + '</span><span class="muted">Send this message to Claude to get it fixed.</span>';
  }
});
</script>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"></script>
<script>(function(root) {
  const MONTHS = { Jan: 1, Feb: 2, Mar: 3, Apr: 4, May: 5, Jun: 6, Jul: 7, Aug: 8, Sep: 9, Oct: 10, Nov: 11, Dec: 12 };
  const DATE_RE = /^(\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d{4})$/;
  const AMT_RE = /^[+-][\d,]+\.\d\d$/;
  const IBAN_RE = /^[A-Z]{2}\d{2}(?: ?[\dA-Z]{4}){2,7}(?: ?[\dA-Z]{1,4})?$/;
  const BIC_RE = /^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$/;
  const num = (s) => parseFloat(s.replace(/,/g, ""));
  const iso = (m) => "".concat(m[3], "-").concat(String(MONTHS[m[2]]).padStart(2, "0"), "-").concat(String(m[1]).padStart(2, "0"));
  function lines(items) {
    const rows = [];
    const sorted = items.filter((i) => i.str.trim() !== "").sort((a, b) => b.y - a.y || a.x - b.x);
    for (const it of sorted) {
      const row = rows.find((r) => Math.abs(r.y - it.y) < 2.5);
      if (row) row.items.push(it);
      else rows.push({ y: it.y, items: [it] });
    }
    rows.forEach((r) => r.items.sort((a, b) => a.x - b.x));
    return rows.sort((a, b) => b.y - a.y);
  }
  function parseStatement(pages) {
    const txns = [];
    const summary = {};
    let cur = null;
    let account = null, period = null, holder = null, isOP = false;
    for (const items of pages) {
      const rows = lines(items);
      let cols = null, started = false;
      for (const r of rows) {
        const txt = r.items.map((i) => i.str.trim()).join(" ");
        if (!account) {
          const m2 = txt.match(/Account number\s+(FI[\d ]+)/);
          if (m2) account = m2[1].trim();
        }
        if (!account && !holder && /^[A-ZÅÄÖÜ][A-ZÅÄÖÜ'.-]+(?: [A-ZÅÄÖÜ][A-ZÅÄÖÜ'.-]+){1,4}$/.test(txt) && !/^(BIC|IBAN)/.test(txt)) holder = txt;
        if (!period) {
          const m2 = txt.match(/^(\d{1,2}(?: \w+)?(?: \d{4})? - \d{1,2} \w+ \d{4})$/);
          if (m2) period = m2[1];
        }
        if (!cols) {
          const by = (s) => r.items.find((i) => i.str.trim().startsWith(s));
          const e = by("Entry"), a = by("Amount"), d = by("Description"), ref = by("Reference"), f = by("Filing");
          if (e && a && d && f) {
            cols = { amount: a.x, desc: d.x, ref: ref ? ref.x : null, filing: f.x };
            isOP = true;
          }
          continue;
        }
        if (!started) {
          if (/^Value date/.test(txt)) started = true;
          continue;
        }
        if (/^(Continued|Contact details)/.test(txt)) break;
        let m;
        if (m = txt.match(/^([+-]?[\d,]+\.\d\d) Deposits\s+(\d+) pcs/)) {
          summary.deposits = num(m[1]);
          summary.depositCount = +m[2];
          cur = null;
          continue;
        }
        if (m = txt.match(/^([+-]?[\d,]+\.\d\d) Withdrawals\s+(\d+) pcs/)) {
          summary.withdrawals = num(m[1]);
          summary.withdrawalCount = +m[2];
          cur = null;
          continue;
        }
        if (m = txt.match(/^([+-][\d,]+\.\d\d) Balance (\d{1,2})\.(\d{1,2})\.(\d{4})/)) {
          const b = { amount: num(m[1]), date: "".concat(m[4], "-").concat(m[3].padStart(2, "0"), "-").concat(m[2].padStart(2, "0")) };
          if (!summary.opening) summary.opening = b;
          else summary.closing = b;
          cur = null;
          continue;
        }
        const first = r.items[0].str.trim();
        const dm = first.match(DATE_RE);
        if (dm && r.items[0].x < cols.amount) {
          const amtItem = r.items.find((i) => AMT_RE.test(i.str.trim()));
          if (!amtItem) continue;
          cur = { date: iso(dm), amount: num(amtItem.str.trim()), type: "", payee: "", message: [], extra: [], reference: "", filing: "", iban: "", bic: "" };
          txns.push(cur);
          for (const it of r.items) {
            if (it === r.items[0] || it === amtItem) continue;
            const s = it.str.trim();
            if (it.x >= cols.filing - 4) cur.filing = (cur.filing + " " + s).trim();
            else if (cols.ref && it.x >= cols.ref - 4) cur.reference = (cur.reference + " " + s).trim();
            else cur.type = (cur.type + " " + s).trim();
          }
          cur.filing = cur.filing.replace(/\s+[AJ]$/, "").replace(/\s+/g, "");
          cur._inMsg = false;
          continue;
        }
        if (!cur) continue;
        for (const it of r.items) {
          const s = it.str.trim();
          if (it.x >= cols.filing - 4) {
            if (IBAN_RE.test(s)) cur.iban = s;
            else if (BIC_RE.test(s)) cur.bic = s;
            continue;
          }
          if (s === "Message:") {
            cur._inMsg = true;
            continue;
          }
          if (!cur.payee && !cur._inMsg) cur.payee = s;
          else if (cur._inMsg) cur.message.push(s);
          else cur.extra.push(s);
        }
      }
    }
    for (const t of txns) {
      delete t._inMsg;
      t.message = t.message.filter((s) => !/^\d{6}\*{6}\d{4}|^MF NRO|^VARMENTAJA|^OSTOPVM/.test(s)).join(" ").replace(/\b[A-Z]{4}FI[A-Z0-9]{2}(XXX)?\b/g, "").replace(/\s+/g, " ").trim();
      t.extra = t.extra.filter((s) => !/^(MESSAGE|SEPA INSTANT CREDIT TRANSFER|SCI[A-Z0-9]+|[A-Z]{6}[A-Z0-9]{5})$/.test(s)).join(" ").trim();
      t.payee = t.payee.replace(/\s{2,}/g, " ").replace(/,$/, "").trim();
      if (/VIPPS MOBILEPAY/i.test(t.payee) && /^MobilePay /.test(t.message)) t.payee = t.message.replace(/^MobilePay /, "MobilePay: ");
      if (/MOB\.PAY\*/i.test(t.payee)) t.payee = t.payee.replace(/MOB\.PAY\*/i, "MobilePay: ");
      if (!t.payee && t.extra) t.payee = t.extra;
      t.id = t.filing || "".concat(t.date, "_").concat(t.amount, "_").concat(t.payee).replace(/[^\w.:@+~-]/g, "_").slice(0, 120);
    }
    if (!isOP) return parseGeneric(pages);
    const range = periodRange(period);
    return { format: "op", account, holder, period, from: range && range[0], to: range && range[1], summary, txns };
  }
  const MONTHS_FULL = { january: 1, february: 2, march: 3, april: 4, may: 5, june: 6, july: 7, august: 8, september: 9, october: 10, november: 11, december: 12 };
  function monthNo(s) {
    if (!s) return null;
    s = s.toLowerCase();
    return MONTHS_FULL[s] || MONTHS[s.slice(0, 1).toUpperCase() + s.slice(1, 3)] || null;
  }
  function periodRange(period) {
    if (!period) return null;
    const [l, r] = period.split(/\s+-\s+/);
    const rm = r && r.match(/^(\d{1,2}) (\w+) (\d{4})$/);
    if (!rm) return null;
    const lm = l.match(/^(\d{1,2})(?: (\w+))?(?: (\d{4}))?$/);
    if (!lm) return null;
    const ry = +rm[3], rmo = monthNo(rm[2]);
    const lmo = lm[2] ? monthNo(lm[2]) : rmo;
    const ly = lm[3] ? +lm[3] : lmo > rmo ? ry - 1 : ry;
    const f = (y, m, d) => "".concat(y, "-").concat(String(m).padStart(2, "0"), "-").concat(String(d).padStart(2, "0"));
    return [f(ly, lmo, +lm[1]), f(ry, rmo, +rm[1])];
  }
  function hash(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
